name: Reporte de Checa

# Web (web_eventos) y app (cuentas, pagos, licencias, invitaciones) desde Supabase.
# Corre solo cada día y también con un push a reportes/pedir.txt (dias=N). Escribe reportes/web.md.
on:
  push:
    branches: [main]
    paths: ["reportes/pedir.txt"]
  schedule:
    - cron: "52 12 * * *"   # diario ~6:52 am hora de México (12:52 UTC)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reporte:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROYECTO: gqsadclvftkzwrihfipz
    steps:
      - uses: actions/checkout@v4
      - name: Consultar
        run: |
          set -euo pipefail
          DIAS=$(grep -oE '^dias=[0-9]+' reportes/pedir.txt | cut -d= -f2 || true)
          DIAS=${DIAS:-30}
          q() {
            jq -n --arg q "$1" '{query: $q}' | curl -sS --fail-with-body -X POST \
              "https://api.supabase.com/v1/projects/$PROYECTO/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" -d @-
          }
          W="creado > now() - interval '$DIAS days'"
          WU="created_at > now() - interval '$DIAS days'"
          HOY="to_char((now() at time zone 'America/Mexico_City')::date,'YYYYMMDD')::int"
          EN7="to_char((now() at time zone 'America/Mexico_City')::date + 7,'YYYYMMDD')::int"
          tabla() { jq -r '(.[0] | keys_unsorted | "| " + join(" | ") + " |"), (.[0] | keys_unsorted | map("---") | "| " + join(" | ") + " |"), (.[] | [.[] | tostring] | "| " + join(" | ") + " |")' 2>/dev/null || echo "Sin datos todavía."; }
          {
            echo "# Reporte de Checa (web + app) · últimos $DIAS días"
            echo
            echo "Generado: $(date -u '+%Y-%m-%d %H:%M') UTC. Cuenta visitas únicas (una por pestaña)."
            echo
            echo "## Resumen"
            q "select (select count(distinct visita) from web_eventos where $W and evento='visita') as visitas, (select count(distinct visita) from web_eventos where $W and evento='descarga') as descargas, (select count(*) from auth.users where $WU) as cuentas_nuevas, (select count(*) from pagos where $W) as pagos, (select coalesce(sum(monto),0) from pagos where $W) as ingresos, (select count(*) from licencias where vence >= $HOY) as licencias_activas" | tabla
            echo
            echo "# App"
            echo
            echo "## Cuentas nuevas por día (inicio con Google)"
            q "select to_char(created_at at time zone 'America/Mexico_City','YYYY-MM-DD') as dia, count(*) as cuentas from auth.users where $WU group by 1 order by 1 desc limit 31" | tabla
            echo
            echo "## Pagos por plan"
            q "select plan, count(*) as pagos, sum(monto) as ingresos from pagos where $W group by plan order by ingresos desc" | tabla
            echo
            echo "## Ingresos por mes (últimos 6)"
            q "select to_char(creado at time zone 'America/Mexico_City','YYYY-MM') as mes, count(*) as pagos, sum(monto) as ingresos from pagos group by 1 order by 1 desc limit 6" | tabla
            echo
            echo "## Licencias activas"
            q "select case when vence = 99991231 then 'sin vencimiento' when max_equipos = 1 then 'básico (1 equipo)' else 'con vencimiento' end as tipo, count(*) filter (where fundador) as fundadores, count(*) as total from licencias where vence >= $HOY group by 1 order by total desc" | tabla
            echo
            echo "## Por vencer en 7 días"
            q "select correo, coalesce(nombre,'') as nombre, vence from licencias where vence between $HOY and $EN7 order by vence" | tabla
            echo
            echo "## Invita a un amigo"
            q "select count(*) as codigos_usados, count(premiado) as premiados from invitaciones where $W" | tabla
            echo
            q "select invitador, count(*) as invitados, count(premiado) as premiados from invitaciones where $W group by 1 order by invitados desc limit 10" | tabla
            echo
            echo "# Web"
            echo
            echo "## Embudo"
            q "select evento, count(distinct visita) as visitas, count(*) as veces from web_eventos where $W group by evento order by visitas desc" | tabla
            echo
            echo "## Por fuente (visitas → descargas)"
            q "select coalesce(fuente,'directo') as fuente, coalesce(campana,'') as campana, count(distinct visita) filter (where evento='visita') as visitas, count(distinct visita) filter (where evento='descarga') as descargas from web_eventos where $W group by 1,2 order by visitas desc limit 20" | tabla
            echo
            echo "## Por dispositivo"
            q "select coalesce(dispositivo,'otro') as dispositivo, count(distinct visita) filter (where evento='visita') as visitas, count(distinct visita) filter (where evento='descarga') as descargas from web_eventos where $W group by 1 order by visitas desc" | tabla
            echo
            echo "## Qué botón lleva a descargar"
            q "select coalesce(desde,'?') as boton, count(*) as descargas from web_eventos where $W and evento='descarga' group by 1 order by descargas desc" | tabla
            echo
            echo "## Por día"
            q "select to_char(creado at time zone 'America/Mexico_City','YYYY-MM-DD') as dia, count(distinct visita) filter (where evento='visita') as visitas, count(distinct visita) filter (where evento='descarga') as descargas from web_eventos where $W group by 1 order by 1 desc limit 31" | tabla
          } > reportes/web.md
          cat reportes/web.md
      - name: Guardar
        run: |
          git config user.name "Checa"
          git config user.email "actions@users.noreply.github.com"
          git add reportes/web.md
          git commit -m "Reporte de la web [skip ci]" || exit 0
          git pull -q --rebase origin main
          git push
