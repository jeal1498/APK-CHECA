name: Generar licencia

on:
  # Pedido desde una conversación con Claude: escribe pedidos/pedido.txt y hace push.
  push:
    branches: [main]
    paths: ["pedidos/pedido.txt"]
  workflow_dispatch:
    inputs:
      equipo:
        description: "Código del equipo (ej. A1B2-C3D4)"
        required: true
      nombre:
        description: "Nombre del conductor"
        required: true
      whatsapp:
        description: "WhatsApp (opcional)"
        required: false
        default: ""
      tipo:
        description: "Tipo de cliente"
        type: choice
        options: [Fundador, Normal]
        default: Fundador
      dias:
        description: "Días de licencia (30 = 1 mes, 365 = 1 año, 0 = sin vencimiento)"
        required: true
        default: "30"

permissions:
  contents: write

concurrency:
  group: licencia
  cancel-in-progress: false

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Firmar y anotar en la tabla
        env:
          EQUIPO: ${{ inputs.equipo }}
          NOMBRE: ${{ inputs.nombre }}
          WHATS: ${{ inputs.whatsapp }}
          TIPO: ${{ inputs.tipo }}
          DIAS: ${{ inputs.dias }}
          LLAVE: ${{ secrets.LICENCIA_PRIVADA }}
        run: |
          set -euo pipefail
          if [ -z "$LLAVE" ]; then echo "Falta el secreto LICENCIA_PRIVADA"; exit 1; fi
          pedido=pedidos/pedido.txt
          if [ "${{ github.event_name }}" = "push" ]; then
            if [ ! -f "$pedido" ]; then echo "No hay pedido"; exit 0; fi
            dato() { grep -i "^$1[[:space:]]*=" "$pedido" | head -1 | cut -d= -f2- | tr -d '\r' | sed 's/^ *//; s/ *$//' || true; }
            EQUIPO=$(dato equipo); NOMBRE=$(dato nombre); WHATS=$(dato whatsapp); DIAS=$(dato dias)
            if dato tipo | grep -qi fund; then TIPO=Fundador; else TIPO=Normal; fi
          fi
          eq=$(printf '%s' "$EQUIPO" | tr 'a-f' 'A-F' | tr -cd '0-9A-F')
          if [ ${#eq} -ne 8 ]; then echo "Código de equipo inválido: $EQUIPO"; exit 1; fi
          if ! printf '%s' "$DIAS" | grep -Eq '^[0-9]+$'; then echo "Días inválidos: $DIAS"; exit 1; fi
          if [ "$DIAS" = "0" ]; then vence=99991231; else vence=$(TZ=America/Cancun date -d "+$DIAS days" +%Y%m%d); fi
          if [ "$TIPO" = "Fundador" ]; then marca=F; extra='|F'; else marca=''; extra=''; fi
          printf '%s\n' "$LLAVE" > llave.pem
          firma=$(printf 'LV|%s|%s%s' "$eq" "$vence" "$extra" | openssl dgst -sha256 -sign llave.pem | base64 -w0 | tr '+/' '-_' | tr -d '=')
          rm -f llave.pem
          codigo="$vence$marca-$firma"

          # --- Tabla de clientes (clientes.md) ---
          limpio() { printf '%s' "$1" | tr -d '|\r\n' | cut -c1-60; }
          hoy=$(TZ=America/Cancun date +%Y-%m-%d)
          if [ "$vence" = "99991231" ]; then fv="Sin vencimiento"; else fv="${vence:0:4}-${vence:4:2}-${vence:6:2}"; fi
          if [ ! -f clientes.md ]; then
            printf '# Clientes de Luz Verde\n\n| Fecha | Nombre | WhatsApp | Equipo | Tipo | Vence |\n|---|---|---|---|---|---|\n' > clientes.md
          fi
          printf '| %s | %s | %s | %s | %s | %s |\n' "$hoy" "$(limpio "$NOMBRE")" "$(limpio "$WHATS")" "${eq:0:4}-${eq:4:4}" "$TIPO" "$fv" >> clientes.md
          fundadores=$(grep '| Fundador |' clientes.md | awk -F'|' '{print $5}' | sort -u | wc -l)
          git config user.name "Luz Verde"
          git config user.email "actions@users.noreply.github.com"
          git add clientes.md
          if [ "${{ github.event_name }}" = "push" ]; then
            {
              echo "nombre=$(limpio "$NOMBRE")"
              echo "equipo=${eq:0:4}-${eq:4:4}"
              echo "tipo=$TIPO"
              echo "vence=$fv"
              echo "codigo=$codigo"
            } > pedidos/respuesta.txt
            git rm -q "$pedido"
            git add pedidos/respuesta.txt
          fi
          git commit -m "Licencia: $(limpio "$NOMBRE") ($TIPO) [skip ci]"
          git pull -q --rebase origin main
          git push

          {
            echo "### Licencia para $(limpio "$NOMBRE") · ${eq:0:4}-${eq:4:4}"
            echo "Tipo: $TIPO · Vence: $fv · Fundadores: $fundadores de 50"
            echo ""
            echo "Copia este código y envíaselo:"
            echo '```'
            echo "$codigo"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "===== CÓDIGO DE ACTIVACIÓN (cópialo completo) ====="
          echo "$codigo"
          echo "==================================================="
