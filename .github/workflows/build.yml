name: Compilar APK

on:
  push:
    branches: [main]
    paths-ignore: ["pedidos/**", "reportes/**", "marketing/**", "clientes.md", "CLAUDE.md", "supabase/**", "docs/**", "video/**", ".claude/**", ".github/workflows/supabase.yml", ".github/workflows/reporte-web.yml", "app/**", ".gitignore", "build.gradle.kts", "settings.gradle.kts", "gradle.properties"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar
        run: gradle assembleRelease --no-daemon
      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk MiRuta.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MiRuta
          path: MiRuta.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Checa v${{ github.run_number }}
          files: MiRuta.apk

  publicar-web:
    needs: build
    uses: ./.github/workflows/publicar-apk.yml
    with:
      tag: v${{ github.run_number }}
    secrets: inherit
