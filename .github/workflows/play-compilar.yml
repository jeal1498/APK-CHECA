# Comprueba que el flavor "play" compila. No publica nada, no toca la web ni version.json.
name: Compilar flavor play

on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/play-compilar.yml"]
  pull_request:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/play-compilar.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Compilar play
        run: gradle assemblePlayRelease --no-daemon
      - name: Verificar divulgación y consentimiento de Accesibilidad para Play
        run: |
          set -euo pipefail
          SRC=app/src/main/java/com/karen/miruta/MainActivity.kt
          PREFS=app/src/main/java/com/karen/miruta/Prefs.kt
          grep -Fq 'getBoolean("diag", !BuildConfig.ES_PLAY)' "$PREFS"
          grep -Fq 'Permiso para leer ofertas' "$SRC"
          grep -Fq 'Acepto y continuar' "$SRC"
          grep -Fq 'accesibilidad_divulgacion_aceptada' "$SRC"
          grep -Fq 'Ahora no' "$SRC"
          grep -Fq 'lector_setup_pospuesto' "$SRC"
          grep -Fq 'Continuar sin iniciar la lectura' "$SRC"
          grep -Fq 'BuildConfig.ES_PLAY' "$SRC"
          echo "OK: divulgación, consentimiento y opción de continuar sin Accesibilidad presentes en el código Play"
      - name: Preparar APK firmado con la llave estable de Play
        id: firma
        if: github.event_name != 'pull_request' || env.PLAY_UPLOAD_KEYSTORE_BASE64 != ''
        shell: bash
        run: |
          set -euo pipefail
          for name in PLAY_UPLOAD_KEYSTORE_BASE64 PLAY_UPLOAD_STORE_PASSWORD PLAY_UPLOAD_KEY_ALIAS PLAY_UPLOAD_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Falta el secreto requerido: $name. No se generará un APK de prueba que falle el acceso con Google."
              exit 1
            fi
          done
          KEYSTORE="$RUNNER_TEMP/checa-upload.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storetype JKS -storepass "$PLAY_UPLOAD_STORE_PASSWORD" -alias "$PLAY_UPLOAD_KEY_ALIAS" >/dev/null
          APK="$(find app/build/outputs/apk/play/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK" || { echo "::error::No hay APK play"; exit 1; }
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -f -p 4 "$APK" "$RUNNER_TEMP/checa-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass "pass:$PLAY_UPLOAD_STORE_PASSWORD" --key-pass "pass:$PLAY_UPLOAD_KEY_PASSWORD" --ks-key-alias "$PLAY_UPLOAD_KEY_ALIAS" --out "$RUNNER_TEMP/checa-play-test.apk" "$RUNNER_TEMP/checa-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose "$RUNNER_TEMP/checa-play-test.apk"
          echo "=== Certificado SHA-1/SHA-256 para comprobar la configuración OAuth ==="
          "$BUILD_TOOLS/apksigner" verify --print-certs "$RUNNER_TEMP/checa-play-test.apk" | grep -E 'certificate SHA-1 digest|certificate SHA-256 digest'
          python3 - "$RUNNER_TEMP/checa-play-test.apk" <<'PY'
          import sys, zipfile
          apk=sys.argv[1]
          man=zipfile.ZipFile(apk).read("AndroidManifest.xml")
          u=lambda t:t.encode("utf-16-le")
          checks={
            "paquete com.jeal1498.checa":u("com.jeal1498.checa") in man,
            "authority com.jeal1498.checa.fileprovider":u("com.jeal1498.checa.fileprovider") in man,
            "sin authority antigua":u("com.karen.miruta.fileprovider") not in man,
            "sin REQUEST_INSTALL_PACKAGES":u("REQUEST_INSTALL_PACKAGES") not in man,
            "sin REQUEST_IGNORE_BATTERY_OPTIMIZATIONS":u("REQUEST_IGNORE_BATTERY_OPTIMIZATIONS") not in man,
          }
          for k,v in checks.items(): print("OK " if v else "FALLA", k)
          if not all(checks.values()): sys.exit(1)
          PY
          mkdir -p "$RUNNER_TEMP/checa-test-apk"
          cp "$RUNNER_TEMP/checa-play-test.apk" "$RUNNER_TEMP/checa-test-apk/checa-play-test.apk"
      - name: Omitir APK en PR externo sin secretos de firma
        if: github.event_name == 'pull_request' && env.PLAY_UPLOAD_KEYSTORE_BASE64 == ''
        run: echo "Compilación validada; no se publica APK porque este PR no tiene acceso a la llave de firma."
      - name: Publicar APK de prueba como artefacto descargable
        if: steps.firma.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: checa-play-apk-firmado-prueba-${{ github.run_number }}
          path: ${{ runner.temp }}/checa-test-apk/*.apk
          if-no-files-found: error
          retention-days: 14
