# Comprueba que el flavor "play" compila. No publica nada, no toca la web ni version.json.
name: Compilar flavor play

on:
  push:
    branches: [main]
    paths: ["app/**", "build.gradle.kts", "settings.gradle.kts", "gradle.properties", ".github/workflows/play-compilar.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Compilar play
        run: gradle assemblePlayRelease --no-daemon
      - name: Paquete y permisos del APK play
        run: |
          APK=$(ls app/build/outputs/apk/play/release/*.apk | head -n1)
          echo "APK: $APK"
          unzip -p "$APK" AndroidManifest.xml | strings -el | grep -E 'com\.(karen|jeal1498)\.' | sort -u
          echo "--- REQUEST_INSTALL_PACKAGES en el manifest de play:"
          unzip -p "$APK" AndroidManifest.xml | strings -el | grep -c REQUEST_INSTALL_PACKAGES || true
