<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src blob:; connect-src 'none'; form-action 'none'">
<title>Checa · Resolver discrepancias</title>
<style>
:root{--f:#0C0C10;--t:#16161C;--x:#F4F4EF;--d:#9a9aa3;--v:#22C55E;--a:#FACC15;--r:#EF4444;--b:#2a2a33}
@media (prefers-color-scheme: light){:root{--f:#F4F4EF;--t:#fff;--x:#0C0C10;--d:#555;--b:#ddd}}
*{box-sizing:border-box}body{margin:0;background:var(--f);color:var(--x);font:15px/1.4 system-ui,sans-serif}
header,main{padding:12px 16px;max-width:1100px;margin:0 auto}
.caja{background:var(--t);border:1px solid var(--b);border-radius:12px;padding:12px;margin-bottom:12px}
.fila{display:flex;gap:8px;flex-wrap:wrap;align-items:end}
label{display:flex;flex-direction:column;font-size:12px;color:var(--d);gap:4px}
input,select,button,textarea{font:inherit;color:var(--x);background:var(--f);border:1px solid var(--b);border-radius:8px;padding:8px;min-height:40px}
button{cursor:pointer}button.pri{border-color:var(--v)}
#visor{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
@media (max-width:800px){#visor{grid-template-columns:1fr}}
#img{width:100%;max-height:78vh;object-fit:contain;background:#000;border-radius:8px}
.clases{display:flex;flex-wrap:wrap;gap:6px}.clases label{flex-direction:row;align-items:center;color:var(--x);font-size:14px;border:1px solid var(--b);border-radius:8px;padding:6px 8px}
#aviso{color:var(--r)}.tenue{color:var(--d);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{border-bottom:1px solid var(--b);padding:4px 6px;text-align:left}td.dif{color:var(--a);font-weight:600}.fila button{min-height:36px}</style>
</head>
<body>
<header>
  <h1 style="font-size:20px;margin:0 0 4px">Checa · Resolver discrepancias entre dos revisores (guía v1.0)</h1>
  <div class="tenue">Miras la captura, ves lo que puso cada revisor y decides el valor correcto. Nada sale de tu navegador.</div>
</header>
<main>
  <div class="caja" id="inicio">
    <div class="fila">
      <label>Seudónimo de quien resuelve (distinto de los dos revisores)<input id="rev" placeholder="consenso"></label>
      <label>Cómo se resuelve<select id="metodo"><option value="consenso">Los dos revisores juntos (consenso)</option><option value="tercera_persona">Una tercera persona</option></select></label>
    </div>
    <div class="fila" style="margin-top:8px">
      <label>conflictos.csv (lo genera el importador)<input id="csv" type="file" accept=".csv,text/csv"></label>
      <label>Carpeta con las capturas<input id="carpeta" type="file" webkitdirectory multiple></label>
      <label>…o los archivos<input id="archivos" type="file" accept=".webp" multiple></label>
    </div>
    <p><button id="empezar" class="pri">Empezar</button></p>
    <p id="aviso"></p>
  </div>
  <div id="visor" hidden>
    <div class="caja"><img id="img" alt="captura"><div class="tenue" id="nombre"></div></div>
    <div class="caja">
      <div class="tenue" id="avance"></div>
      <table id="tabla"></table>
      <div class="fila" style="margin-top:8px"><button id="usaA"></button><button id="usaB"></button></div>
      <p><b>Valor correcto</b></p>
      <div class="clases" id="clases"></div>
      <div class="fila">
        <label>App<select id="app"><option value="">—</option><option value="didi">DiDi</option><option value="uber">Uber</option></select></label>
        <label>Tarjeta<input id="tarjeta" type="number" min="1" max="20" style="width:90px"></label>
        <label>Tarifa<input id="tarifa" inputmode="decimal" style="width:100px"></label>
        <label>km<input id="km" inputmode="decimal" style="width:80px"></label>
        <label>min<input id="min" inputmode="decimal" style="width:80px"></label>
      </div>
      <div class="fila">
        <label>Confianza<select id="confianza"><option>alta</option><option selected>media</option><option>baja</option></select></label>
        <label style="flex:1">Nota (sin direcciones ni nombres)<input id="nota" maxlength="280"></label>
      </div>
      <p id="error" style="color:var(--r)"></p>
      <div class="fila"><button id="ant">‹ Anterior</button><button id="saltar">Saltar (queda pendiente)</button><button id="sig" class="pri">Guardar y siguiente ›</button></div>
      <hr style="border-color:var(--b)">
      <div class="fila"><button id="exportar" class="pri">Exportar CSV</button><span class="tenue" id="hechas"></span></div>
    </div>
  </div>
</main>
<script>
"use strict";
var CLASES=[["oferta","Oferta"],["no_oferta","No es oferta"],["varias","Varias"],["ilegible","Ilegible"],["cambio_pantalla","Cambió la pantalla"]];
var CAMPOS=["clase","app","tarjeta","tarifa","km","min"], GUIA="1.0", lista=[], i=0, res={}, R=[];
function $(id){return document.getElementById(id)}
// sha256 propio (no depende de crypto.subtle, que no siempre existe al abrir el archivo desde el disco)
function sha256(buf){var K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 var b=new Uint8Array(buf),l=b.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(b);m[l]=0x80;var dv=new DataView(m.buffer);dv.setUint32(n-4,(l*8)>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
 var H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19],w=new Uint32Array(64);
 for(var o=0;o<n;o+=64){for(var t=0;t<16;t++)w[t]=dv.getUint32(o+t*4);for(t=16;t<64;t++){var x=w[t-15],y=w[t-2];var s0=((x>>>7)|(x<<25))^((x>>>18)|(x<<14))^(x>>>3),s1=((y>>>17)|(y<<15))^((y>>>19)|(y<<13))^(y>>>10);w[t]=(w[t-16]+s0+w[t-7]+s1)>>>0}
  var a=H[0],c=H[1],d=H[2],e=H[3],f=H[4],g=H[5],h=H[6],k=H[7];
  for(t=0;t<64;t++){var S1=((f>>>6)|(f<<26))^((f>>>11)|(f<<21))^((f>>>25)|(f<<7)),ch=(f&g)^(~f&h),T1=(k+S1+ch+K[t]+w[t])>>>0,S0=((a>>>2)|(a<<30))^((a>>>13)|(a<<19))^((a>>>22)|(a<<10)),mj=(a&c)^(a&d)^(c&d),T2=(S0+mj)>>>0;k=h;h=g;g=f;f=(e+T1)>>>0;e=d;d=c;c=a;a=(T1+T2)>>>0}
  H=[(H[0]+a)>>>0,(H[1]+c)>>>0,(H[2]+d)>>>0,(H[3]+e)>>>0,(H[4]+f)>>>0,(H[5]+g)>>>0,(H[6]+h)>>>0,(H[7]+k)>>>0]}
 return H.map(function(v){return("00000000"+v.toString(16)).slice(-8)}).join("")}

function guardarLocal(){try{localStorage.setItem("checa-res-"+$("rev").value,JSON.stringify(res))}catch(e){}}
function cargarLocal(){try{res=JSON.parse(localStorage.getItem("checa-res-"+$("rev").value)||"{}")}catch(e){res={}}}
CLASES.forEach(function(c){var l=document.createElement("label");var r=document.createElement("input");r.type="radio";r.name="clase";r.value=c[0];l.appendChild(r);l.appendChild(document.createTextNode(" "+c[1]));$("clases").appendChild(l)});
function parseCSV(t){var rows=[],row=[],c="",q=false;for(var k=0;k<t.length;k++){var ch=t[k];
  if(q){if(ch==='"'){if(t[k+1]==='"'){c+='"';k++}else q=false}else c+=ch}
  else if(ch==='"')q=true;else if(ch===","){row.push(c);c=""}else if(ch==="\n"){row.push(c);rows.push(row);row=[];c=""}else if(ch!=="\r")c+=ch}
  if(c!==""||row.length){row.push(c);rows.push(row)}return rows}
function leerConflictos(t){var rows=parseCSV(t);if(rows.length<2)return null;var h=rows[0],revs=[];
  h.forEach(function(x){var m=/^(.*)_clase$/.exec(x);if(m)revs.push(m[1])});if(revs.length!==2||h[0]!=="caso")return null;
  var out=[];rows.slice(1).forEach(function(r){if(!r[0])return;var o={caso:r[0],v:{}};revs.forEach(function(p){o.v[p]={};CAMPOS.forEach(function(c){var j=h.indexOf(p+"_"+c);o.v[p][c]=j<0?"":r[j]})});out.push(o)});
  R=revs;return out}
$("empezar").onclick=async function(){$("aviso").textContent="";
  if(!/^[a-z0-9_]{2,32}$/.test($("rev").value)){$("aviso").textContent="Pon un seudónimo (minúsculas, números o _).";return}
  var f=$("csv").files[0];if(!f){$("aviso").textContent="Falta conflictos.csv.";return}
  var conf=leerConflictos(await f.text());if(!conf){$("aviso").textContent="conflictos.csv no tiene el formato esperado (caso y dos revisores).";return}
  if(R.indexOf($("rev").value)>=0){$("aviso").textContent="Quien resuelve no puede usar el seudónimo de uno de los revisores ("+R.join(", ")+").";return}
  var files=$("carpeta").files.length?$("carpeta").files:$("archivos").files,por={};
  Array.prototype.forEach.call(files,function(x){var m=/^(\d{1,4})\.webp$/.exec(x.name);if(m)por[parseInt(m[1],10)]=x});
  lista=[];var sin=[];for(var c of conf){var id=parseInt(c.caso,10),fi=por[id];if(!fi){sin.push(c.caso);continue}
    var buf=await fi.arrayBuffer();lista.push({id:id,caso:c.caso,nombre:id+".webp",sha:sha256(buf),url:URL.createObjectURL(fi),v:c.v})}
  if(!lista.length){$("aviso").textContent="No encontré ninguna imagen de las discrepancias.";return}
  if(sin.length)$("aviso").textContent="Sin imagen (no se pueden resolver): "+sin.join(", ");
  cargarLocal();i=0;$("inicio").hidden=true;$("visor").hidden=false;$("usaA").textContent="Usar la de "+R[0];$("usaB").textContent="Usar la de "+R[1];mostrar()};
function n(v){if(v===null||v===undefined||v==="")return"";var x=Number(v);return v!==" "&&isFinite(x)&&/^[0-9.]+$/.test(String(v))?String(x):String(v)}   // «40.0» y «40» son lo mismo
function poner(p){document.querySelectorAll("input[name=clase]").forEach(function(x){x.checked=x.value===p.clase});
  $("app").value=p.app||"";$("tarjeta").value=n(p.tarjeta);$("tarifa").value=n(p.tarifa);$("km").value=n(p.km);$("min").value=n(p.min)}
function mostrar(){var c=lista[i],r=res[c.nombre];$("img").src=c.url;$("nombre").textContent=c.nombre+" · sha256 "+c.sha.slice(0,12)+"…";
  $("avance").textContent="Discrepancia "+(i+1)+" de "+lista.length;
  var t="<tr><th></th>"+CAMPOS.map(function(x){return"<th>"+x+"</th>"}).join("")+"</tr>";
  var tb=$("tabla");tb.textContent="";var head=document.createElement("tr");head.appendChild(document.createElement("th"));CAMPOS.forEach(function(x){var th=document.createElement("th");th.textContent=x;head.appendChild(th)});tb.appendChild(head);
  R.forEach(function(p){var tr=document.createElement("tr"),th=document.createElement("th");th.textContent=p;tr.appendChild(th);
    CAMPOS.forEach(function(x){var td=document.createElement("td");td.textContent=n(c.v[p][x])||"—";
      var otro=R.filter(function(q){return q!==p})[0];if(n(c.v[p][x])!==n(c.v[otro][x]))td.className="dif";tr.appendChild(td)});tb.appendChild(tr)});
  poner(r?r:{clase:"",app:"",tarjeta:"",tarifa:"",km:"",min:""});$("confianza").value=r?r.confianza:"media";$("nota").value=r?r.nota:"";$("error").textContent="";
  $("hechas").textContent=Object.keys(res).filter(function(k){return lista.some(function(x){return x.nombre===k})}).length+" de "+lista.length+" resueltas"}
$("usaA").onclick=function(){poner(lista[i].v[R[0]])};$("usaB").onclick=function(){poner(lista[i].v[R[1]])};
function num(v){v=(v||"").trim().replace(",",".");if(!v)return"";var x=Number(v);return isFinite(x)&&x>0?String(x):null}
function leer(){var cl=document.querySelector("input[name=clase]:checked");if(!cl)return["Elige qué es."];if(!$("app").value)return["Elige la app."];
  var t=num($("tarifa").value),k=num($("km").value),m=num($("min").value);if(t===null||k===null||m===null)return["Tarifa, km y min deben ser números mayores que 0."];
  if(cl.value==="oferta"&&(!t||!k||!m))return["Una oferta necesita tarifa, km y min."];if(cl.value!=="oferta"&&(t||k||m))return["Solo una oferta lleva tarifa, km y min: déjalos vacíos."];
  var tj=($("tarjeta").value||"").trim();if(tj&&!/^([1-9]|1\d|20)$/.test(tj))return["Tarjeta: número del 1 al 20."];
  return[null,{clase:cl.value,app:$("app").value,tarjeta:tj,tarifa:t,km:k,min:m,confianza:$("confianza").value,nota:$("nota").value.replace(/[\r\n]/g," ").slice(0,280)}]}
function eligio(v,c){var iguales=function(p){return CAMPOS.every(function(x){return n(c.v[p][x])===n(v[x])})};
  var a=R.filter(iguales);return a.length===1?a[0]:"otro"}
function sig(){if(i<lista.length-1){i++;mostrar()}else{$("hechas").textContent="Terminaste. Exporta el CSV."}}
$("sig").onclick=function(){var r=leer();if(r[0]){$("error").textContent=r[0];return}var c=lista[i];r[1].eligio=eligio(r[1],c);res[c.nombre]=r[1];guardarLocal();sig()};
$("saltar").onclick=sig;$("ant").onclick=function(){if(i>0){i--;mostrar()}};
function celda(v){v=String(v==null?"":v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
$("exportar").onclick=function(){var filas=[["caso","captura","captura_sha256","revisor","guia_version","clase","tarifa","km","min","tarjeta","confianza","nota","metodo","eligio"]];
  lista.forEach(function(c){var r=res[c.nombre];if(!r)return;filas.push([("0000"+c.id).slice(-4)+"-"+r.app,c.nombre,c.sha,$("rev").value,GUIA,r.clase,r.tarifa,r.km,r.min,r.tarjeta,r.confianza,r.nota,$("metodo").value,r.eligio])});
  var csv=filas.map(function(f){return f.map(celda).join(",")}).join("\n")+"\n";var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="resolucion-"+$("rev").value+".csv";a.click()};
</script>
</body>
</html>
