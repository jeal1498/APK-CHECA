<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:FS;src:url('../assets/fonts/FiraSans-Bold.ttf');font-weight:800}
@font-face{font-family:FS;src:url('../assets/fonts/FiraSans-Medium.ttf');font-weight:500}
@font-face{font-family:FC;src:url('../assets/fonts/FiraCode.ttf')}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0D0D0D;font-family:FS}
.glow{position:absolute;left:-100px;top:620px;width:1280px;height:1000px;background:radial-gradient(circle,rgba(244,63,94,.26),rgba(0,0,0,0) 62%)}
.t{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.04em;line-height:.95;text-transform:uppercase}
.t1{top:310px;font-size:120px;color:#F1F5F2}
.t2{top:435px;font-size:160px;color:#FACC15}
.card{position:absolute;left:230px;top:700px;width:620px;height:590px;border-radius:44px;background:#F4F5F4;transform:rotate(-4deg);box-shadow:0 40px 90px rgba(0,0,0,.8)}
.card .k{position:absolute;left:52px;top:44px;font-family:FC;font-size:28px;letter-spacing:.14em;color:#5C635F;text-transform:uppercase}
.card svg{position:absolute;left:230px;top:96px;width:150px;height:195px}
.card .can{position:absolute;left:52px;right:52px;top:330px;height:120px;border-radius:26px;background:#F43F5E;color:#fff;display:flex;align-items:center;justify-content:center;font-family:FC;font-weight:700;font-size:68px;letter-spacing:.06em}
.card .l1{position:absolute;left:52px;top:486px;width:420px;height:22px;border-radius:11px;background:#D5D9D7}
.card .l2{position:absolute;left:52px;top:530px;width:300px;height:22px;border-radius:11px;background:#D5D9D7}
.tag{position:absolute;left:240px;top:1340px;transform:rotate(-3deg);background:#F43F5E;color:#fff;border-radius:28px;padding:26px 40px;font-size:60px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.tag span{font-family:FC;filter:blur(14px);display:inline-block;margin-left:12px}
.q{position:absolute;left:760px;top:640px;font-size:320px;font-weight:800;color:#F43F5E;transform:rotate(12deg);line-height:1}
.sub{position:absolute;left:0;right:0;top:1500px;text-align:center;font-size:52px;font-weight:500;color:#AFB7B2}
.sub b{color:#F1F5F2}
</style></head><body>
<div class="glow"></div>
<div class="t t1">Te cancelan</div>
<div class="t t2">¿qué haces?</div>
<div class="card"><div class="k">Nueva solicitud</div><svg viewBox="0 0 200 260" fill="none"><path d="M100 14 C58 14 30 46 30 86 C30 140 100 238 100 238 C100 238 170 140 170 86 C170 46 142 14 100 14 Z" fill="#22C55E" stroke="#111" stroke-width="8"/><circle cx="100" cy="86" r="30" fill="#111"/></svg><div class="can">CANCELADO</div><div class="l1"></div><div class="l2"></div></div>
<div class="q">?</div>
<div class="tag">Jugada 4: <span>NO DISCUTAS</span></div>
<div class="sub">La <b>cuarta</b> es la que te cuida</div>
</body></html>
