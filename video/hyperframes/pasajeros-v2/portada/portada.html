<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:FS;src:url('../assets/fonts/FiraSans-Bold.ttf');font-weight:800}
@font-face{font-family:FS;src:url('../assets/fonts/FiraSans-Medium.ttf');font-weight:500}
@font-face{font-family:FC;src:url('../assets/fonts/FiraCode.ttf')}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0D0D0D;font-family:FS}
.glow{position:absolute;left:-100px;top:620px;width:1280px;height:1000px;background:radial-gradient(circle,rgba(244,63,94,.26),rgba(0,0,0,0) 62%)}
.t{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.04em;line-height:.95;text-transform:uppercase}
.t1{top:250px;font-size:104px;color:#F1F5F2}
.t2{top:365px;font-size:140px;color:#FACC15}
.card{position:absolute;left:230px;top:700px;width:620px;height:640px;border-radius:44px;background:#151918;border:3px solid #2A2E2C;transform:rotate(-4deg);box-shadow:0 40px 90px rgba(0,0,0,.8)}
.card svg{position:absolute;left:130px;top:70px;width:360px;height:430px}
.card .lab{position:absolute;left:0;right:0;bottom:36px;text-align:center;font-family:FC;font-size:34px;letter-spacing:.16em;color:#8A938E}
.tag{position:absolute;left:300px;top:1400px;transform:rotate(-3deg);background:#F43F5E;color:#fff;border-radius:28px;padding:26px 40px;font-size:60px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.tag span{font-family:FC;filter:blur(14px);display:inline-block;margin-left:12px}
.q{position:absolute;left:800px;top:640px;font-size:320px;font-weight:800;color:#F43F5E;transform:rotate(12deg);line-height:1}
.sub{position:absolute;left:0;right:0;top:1620px;text-align:center;font-size:52px;font-weight:500;color:#AFB7B2}
.sub b{color:#F1F5F2}
</style></head><body>
<div class="glow"></div>
<div class="t t1">De un viaje de $90</div>
<div class="t t2">¿cuánto te queda?</div>
<div class="card"><svg viewBox="0 0 200 240" fill="none" stroke="#F1F5F2" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"><rect x="34" y="116" width="92" height="90" rx="6" fill="#F43F5E" stroke="none" opacity=".9"/><rect x="30" y="20" width="100" height="190" rx="14"/><rect x="46" y="38" width="68" height="52" rx="8"/><path d="M130 70 C170 70 172 130 162 148 L162 196"/><path d="M14 214 H146"/></svg><div class="lab">GASOLINA</div></div>
<div class="q">?</div>
<div class="tag">Te quedan <span>$60</span></div>
<div class="sub">¿Cuánto se come la <b>gasolina</b>?</div>
</body></html>
