<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* Subtítulo v2: sin placa; sombra oscura para leerse sobre cualquier fondo */
  .caption-pill {
    max-width: 86%;
    padding: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.04em 0.3em;
    font-family: "Bricolage Grotesque", "Arial Black", sans-serif;
    font-weight: 800;

  /* palabra por venir */
  .caption-word {
    display: inline-block;
    padding: 0 0.08em;
    color: #B6B6BE;
  }
  /* palabra activa: bloque amarillo calle con texto oscuro (estilo A de la lámina 6) */
  .caption-word.is-active {
    color: #14141A;
    background: #FACC15;
    border-radius: 0.18em;
    box-shadow: 0 0 0 0.06em #FACC15;
    text-shadow: none;
  }
  /* palabra ya dicha */
  .caption-word.is-spoken {
    color: #F4F4EF;
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — fire-orange ink, the cream-on-ink register's only inflection */
  .caption-word.cap-brand {
    color: #F4F4EF;
  }
  /* numerals / data — the IBM Plex Mono chrome voice, uppercase + tracked, recessed */
  .caption-word.cap-num {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    color: #F4F4EF;
  }
  /* cifras con color del semáforo: añadir cap-gana (verde) o cap-pierde (rojo) a la palabra */
  .caption-word.cap-gana { color: #22C55E; }
  .caption-word.cap-pierde { color: #EF4444; }
  /* emphasis — a fire-orange hairline underline (no second hue; the lone accent again) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-decoration-color: #FACC15;
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 90%;
    }
    .caption-line {
      font-size: clamp(44px, 5.8vw, 60px);
    }
  }
