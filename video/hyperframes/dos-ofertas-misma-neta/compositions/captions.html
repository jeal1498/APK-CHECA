      :root {

<style>
  #captions-root {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;
  }
  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* Subtítulo v2: sin placa; sombra oscura para leerse sobre cualquier fondo */
  .caption-pill {
    max-width: 86%;
    padding: 0;
    background: transparent;
    border: 0;
    border-radius: 0;
  }
  .caption-line {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.04em 0.3em;
    font-family: "Bricolage Grotesque", "Arial Black", sans-serif;
    font-weight: 800;
    font-size: clamp(48px, 5.2vw, 64px);
    line-height: 1.08;
    letter-spacing: -0.03em;
    text-shadow: 0 2px 0 #0C0C10, 0 0 14px #0C0C10, 0 0 28px rgba(12,12,16,.8);
  }

  /* palabra por venir */
  .caption-word {
    display: inline-block;
    padding: 0 0.08em;
    color: #B6B6BE;
  }
  /* palabra activa: bloque amarillo calle con texto oscuro (estilo A de la lámina 6) */
  .caption-word.is-active {
    color: #14141A;
    background: #FACC15;
    border-radius: 0.18em;
    box-shadow: 0 0 0 0.06em #FACC15;
    text-shadow: none;
  }
  /* palabra ya dicha */
  .caption-word.is-spoken {
    color: #F4F4EF;
    background: transparent;
    box-shadow: none;
  }

  /* optional per-word accents (dormant until a word-classer tags them) */
  /* brand / key term — fire-orange ink, the cream-on-ink register's only inflection */
  .caption-word.cap-brand {
    color: #F4F4EF;
  }
  /* numerals / data — the IBM Plex Mono chrome voice, uppercase + tracked, recessed */
  .caption-word.cap-num {
    font-family: "Bricolage Grotesque", sans-serif;
    font-weight: 800;
    color: #F4F4EF;
  }
  /* cifras con color del semáforo: añadir cap-gana (verde) o cap-pierde (rojo) a la palabra */
  .caption-word.cap-gana { color: #22C55E; }
  .caption-word.cap-pierde { color: #EF4444; }
  /* emphasis — a fire-orange hairline underline (no second hue; the lone accent again) */
  .caption-word.cap-cta {
    text-decoration: underline;
    text-decoration-thickness: 3px;
    text-decoration-color: #FACC15;
    text-underline-offset: 0.1em;
  }

  @media (max-aspect-ratio: 9/16) {
    .caption-pill {
      max-width: 90%;
    }
    .caption-line {
      font-size: clamp(44px, 5.8vw, 60px);
    }
  }
</style>

>

<script>
  // captions.mjs injects the engine's scene-aware groups + real duration here.
  var GROUPS = [{"id":"caption-group-0","frame":1,"start":0.0,"end":1.9,"text":"Te ofrecen 95 pesos.","words":[{"id":"caption-word-0-0","text":"Te","start":0.0,"end":0.15},{"id":"caption-word-0-1","text":"ofrecen","start":0.2,"end":0.56},{"id":"caption-word-0-2","text":"95","start":0.61,"end":1.14},{"id":"caption-word-0-3","text":"pesos.","start":1.29,"end":1.65}]},{"id":"caption-group-1","frame":1,"start":1.7,"end":3.18,"text":"Te quedan 67.","words":[{"id":"caption-word-1-0","text":"Te","start":1.7,"end":1.8},{"id":"caption-word-1-1","text":"quedan","start":1.85,"end":2.09},{"id":"caption-word-1-2","text":"67.","start":2.14,"end":2.93}]},{"id":"caption-group-2","frame":2,"start":3.076,"end":4.116,"text":"La gasolina de la","words":[{"id":"caption-word-2-0","text":"La","start":3.076,"end":3.236},{"id":"caption-word-2-1","text":"gasolina","start":3.276,"end":3.676},{"id":"caption-word-2-2","text":"de","start":3.716,"end":3.776},{"id":"caption-word-2-3","text":"la","start":3.816,"end":3.866}]},{"id":"caption-group-3","frame":2,"start":3.926,"end":5.366,"text":"recogida y del viaje","words":[{"id":"caption-word-3-0","text":"recogida","start":3.926,"end":4.436},{"id":"caption-word-3-1","text":"y","start":4.506,"end":4.546},{"id":"caption-word-3-2","text":"del","start":4.636,"end":4.746},{"id":"caption-word-3-3","text":"viaje","start":4.806,"end":5.116}]},{"id":"caption-group-4","frame":2,"start":5.166,"end":6.716,"text":"también la pagas tú.","words":[{"id":"caption-word-4-0","text":"también","start":5.166,"end":5.536},{"id":"caption-word-4-1","text":"la","start":5.586,"end":5.646},{"id":"caption-word-4-2","text":"pagas","start":5.696,"end":6.046},{"id":"caption-word-4-3","text":"tú.","start":6.096,"end":6.466}]}];
  var DURATION = 7.066;

  (function () {
    var stage = document.getElementById("caption-stage");

    // build DOM: one .caption-group per group, .caption-word per word
    GROUPS.forEach(function (group, g) {
      var groupEl = document.createElement("div");
      groupEl.className = "caption-group";
      groupEl.id = "caption-group-" + g;
      var pill = document.createElement("div");
      pill.className = "caption-pill";
      var line = document.createElement("div");
      line.className = "caption-line";
      (group.words || []).forEach(function (w, i) {
        var span = document.createElement("span");
        span.className = "caption-word";
        span.id = "caption-word-" + g + "-" + i;
        span.textContent = String(w.text);
        line.appendChild(span);
      });
      pill.appendChild(line);
      groupEl.appendChild(pill);
      stage.appendChild(groupEl);
    });

    window.__timelines = window.__timelines || {};
    var tl = gsap.timeline({ paused: true });

    GROUPS.forEach(function (group, g) {
      var groupEl = document.getElementById("caption-group-" + g);
      var words = group.words || [];
      var next = GROUPS[g + 1];
      var isLast = g === GROUPS.length - 1;
      var start = Math.max(0, Number(group.start));
      var end = isLast ? DURATION : Math.min(Number(next.start), Number(group.end) + 0.3);
      if (end <= start) end = start + 0.01;

      // group on/off — exactly one group visible at a time
      tl.set(groupEl, { opacity: 1 }, start);
      tl.set(groupEl, { opacity: 0 }, end);

      // 3-state karaoke via className SETS — seek-safe (gsap.set applies on the
      // engine's frame-by-frame seek; .call callbacks would NOT fire).
      words.forEach(function (w, i) {
        var el = document.getElementById("caption-word-" + g + "-" + i);
        var at = Math.max(start, Number(w.start));
        tl.set(el, { className: "caption-word" }, start); // upcoming (also resets on reverse-seek)
        tl.set(el, { className: "caption-word is-active" }, at); // current
        tl.fromTo(el, { scale: 0.92 }, { scale: 1, duration: 0.1, ease: "power3.out" }, at);
        if (i + 1 < words.length) {
          var nextAt = Math.max(start, Number(words[i + 1].start));
          tl.set(el, { className: "caption-word is-spoken" }, nextAt); // demote when next activates
        }
      });
      if (words.length) {
        var lastEl = document.getElementById("caption-word-" + g + "-" + (words.length - 1));
        var lastSpoken = Math.min(end, Number(words[words.length - 1].end) + 0.1);
        tl.set(lastEl, { className: "caption-word is-spoken" }, lastSpoken);
      }
    });

    // full-span anchor so the sub-comp timeline spans the whole video
    tl.to({}, { duration: DURATION }, 0);
    window.__timelines["captions"] = tl;
  })();
</script>
