<!--
  Pop-up de Checa en MARCA V2 (lámina 8 del artifact «Checa: identidad de marca»; fuente: jeal1498/checa-web, carpeta marca/).
  Copiar tal cual; cambiar solo cifras, nivel y clases. La app Android aún usa el pop-up anterior hasta que se aplique la v2.
  Tamaño: ancho base 860px; para otro ancho usa style="--u:0.9" (escala todo).
  REGLA: los tres niveles miden EXACTAMENTE lo mismo (mismo alto, mismas fichas); solo cambian color y datos.
  Niveles: cp-verde (ACEPTAR) · cp-amarillo (CONSIDERAR) · cp-rojo (RECHAZAR).
  Variantes: cp-mejor (borde hueso + etiqueta MEJOR = la mejor de 2 ofertas; el borde ocupa el mismo espacio en todos) · cp-apagada (franja al 50 %).
  Ficha: cp-ok (número verde, cumple la meta) · cp-mal (fondo rojo oscuro, borde y número rojos, no cumple; si falla la recogida el texto va en la 3ª ficha: «Rec. 6 km») · sin clase (neutra).
  Regla: ningún texto puede ser solo un monto suelto; siempre «$x netos», «$x/h», «$x/km», «… km total».
-->
<style>
  .cp { --u: 1; width: calc(860px * var(--u)); height: calc(640px * var(--u)); box-sizing: border-box; border-radius: calc(44px * var(--u)); background: #16161C; border: calc(6px * var(--u)) solid #2A2A33; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 calc(24px * var(--u)) calc(60px * var(--u)) rgba(0,0,0,.6); font-family: "DM Sans", Arial, sans-serif; color: #F4F4EF; position: relative; }
  .cp.cp-mejor { border-color: #F4F4EF; }
  .cp-etiqueta { position: absolute; top: calc(-6px * var(--u)); right: calc(40px * var(--u)); background: #F4F4EF; color: #0C0C10; font-weight: 700; font-size: calc(22px * var(--u)); letter-spacing: calc(2px * var(--u)); padding: calc(4px * var(--u)) calc(20px * var(--u)); border-radius: 0 0 calc(16px * var(--u)) calc(16px * var(--u)); }
  .cp-banda { flex: none; height: calc(100px * var(--u)); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(34px * var(--u)); color: #04210F; }
  .cp-verde .cp-banda { background: #22C55E; color: #04210F; }
  .cp-amarillo .cp-banda { background: #FACC15; color: #2B2200; }
  .cp-rojo .cp-banda { background: #EF4444; color: #1F0000; }
  .cp-apagada .cp-banda { opacity: .5; }
  .cp-lado { width: calc(190px * var(--u)); display: flex; align-items: center; gap: calc(8px * var(--u)); }
  .cp-lado.der { justify-content: flex-end; }
  .cp-app { background: #0C0C10; color: #F4F4EF; border-radius: 999px; padding: calc(6px * var(--u)) calc(16px * var(--u)); font-size: calc(26px * var(--u)); font-weight: 700; }
  .cp-accion { font-family: "Bricolage Grotesque", "Arial Black", sans-serif; font-size: calc(50px * var(--u)); font-weight: 800; letter-spacing: calc(5px * var(--u)); }
  .cp-cuerpo { flex: 1; min-height: 0; padding: calc(30px * var(--u)) calc(30px * var(--u)) calc(30px * var(--u)); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
  .cp-neta { font-family: "Bricolage Grotesque", "Arial Black", sans-serif; font-weight: 800; font-size: calc(150px * var(--u)); line-height: 1; letter-spacing: calc(-6px * var(--u)); }
  .cp-neta small { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: .2em; letter-spacing: 0; color: #A3A3AD; }
  .cp-linea { font-size: calc(36px * var(--u)); color: #A3A3AD; white-space: nowrap; }
  .cp-fichas { display: flex; gap: calc(20px * var(--u)); }
  .cp-ficha { flex: 1; min-width: 0; height: calc(150px * var(--u)); box-sizing: border-box; border-radius: calc(28px * var(--u)); background: #1B1B22; border: calc(3px * var(--u)) solid #1B1B22; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .cp-ficha b { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: calc(40px * var(--u)); white-space: nowrap; }
  .cp-ficha span { font-size: calc(26px * var(--u)); color: #8A8A95; margin-top: calc(4px * var(--u)); white-space: nowrap; }
  .cp-ok { background: #12301F; border-color: #22C55E; } .cp-ok b { color: #22C55E; }
  .cp-mal { background: #3A1414; border-color: #EF4444; } .cp-mal b { color: #EF4444; }
</style>
<!-- Ejemplo: oferta que conviene (números de ejemplo: $150 de tarifa, gasolina $32, 16 km, 28 min) -->
<div class="cp cp-verde">
  <div class="cp-banda">
    <div class="cp-lado"><span class="cp-app">UBER</span></div>
    <div class="cp-accion">ACEPTAR</div>
    <div class="cp-lado der"><svg width="44" height="44" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
  </div>
  <div class="cp-cuerpo">
    <div class="cp-neta">$118<small>&nbsp;netos</small></div>
    <div class="cp-linea">Viaje $150&nbsp;·&nbsp;Gasolina −$32</div>
    <div class="cp-fichas">
      <div class="cp-ficha cp-ok"><b>$321/h</b><span>por hora</span></div>
      <div class="cp-ficha cp-ok"><b>$9.4/km</b><span>por km</span></div>
      <div class="cp-ficha"><b>28 min</b><span>16 km total</span></div>
    </div>
  </div>
</div>
