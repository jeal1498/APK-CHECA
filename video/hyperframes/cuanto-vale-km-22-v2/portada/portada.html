<!-- PLANTILLA DE PORTADA (marca v2). Estilo aprobado por Eduardo el 24 oct 2026 (video 23).
 Qué se cambia en cada portada: .k (etiqueta gris, la frase del gancho), .t (título enorme: pregunta, número o afirmación;
 si lleva groserías, censurada «v***»), la tarjeta .card (oferta con estructura de app de viajes: VIAJE, ★ calificación,
 precio, $/km est., recogida, viaje, botón Aceptar; sin logo ni nombre de Uber/DiDi) y el sello amarillo (.sello: respuesta
 borrosa). Las cifras deben cuadrar con el video (neta = viaje − 13.8 km × $2 ≈ $67). Zona segura y 300–1620.
 Render: chrome --headless --window-size=1080,1920 --allow-file-access-from-files --screenshot=p.png portada.html; ffmpeg -q:v 3 portada.jpg -->
<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BG;src:url('../assets/fonts/bricolage-grotesque-latin-800-normal.woff2');font-weight:800}
@font-face{font-family:DM;src:url('../assets/fonts/dm-sans-latin-500-normal.woff2');font-weight:500}
@font-face{font-family:JB;src:url('../assets/fonts/jetbrains-mono-latin-700-normal.woff2');font-weight:700}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0C0C10;font-family:DM;color:#F4F4EF}
.road{position:absolute;left:0;top:0}
.k{position:absolute;left:84px;top:330px;font-family:JB;font-weight:700;font-size:38px;letter-spacing:.14em;color:#A3A3AD}
.t{position:absolute;left:78px;top:395px;font-family:BG;font-weight:800;font-size:164px;line-height:.92;letter-spacing:-.06em}
.sello{position:absolute;left:610px;top:1230px;width:300px;height:300px;border-radius:50%;background:#FACC15;color:#2B2200;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-12deg);font-family:BG;font-weight:800;line-height:1;box-shadow:0 24px 50px rgba(0,0,0,.6)}
.sello .a{font-size:30px;letter-spacing:.06em}
.sello .n{font-size:110px;letter-spacing:-.04em;filter:blur(13px);margin-top:6px}
.logo{position:absolute;left:84px;top:1490px;display:flex;align-items:center;gap:22px}
.logo span{font-family:BG;font-weight:800;font-size:84px;letter-spacing:-.04em}
.card{position:absolute;left:84px;top:820px;width:640px;height:610px;border-radius:30px;background:#F4F4EF;color:#0C0C10;transform:rotate(-3deg);box-shadow:0 40px 80px rgba(0,0,0,.6);font-family:DM}
.card .top{position:absolute;left:44px;top:34px;right:44px;display:flex;justify-content:space-between;align-items:center}
.card .pill{background:#0C0C10;color:#F4F4EF;border-radius:999px;padding:8px 22px;font-family:JB;font-weight:700;font-size:24px;letter-spacing:.08em}
.card .rate{font-family:JB;font-weight:700;font-size:28px;color:#3A3A45}
.card .p{position:absolute;left:44px;top:92px;font-family:BG;font-weight:800;font-size:150px;letter-spacing:-.05em;line-height:1}
.card .km{position:absolute;left:48px;top:246px;font-family:JB;font-weight:700;font-size:28px;color:#55555F}
.card .hr{position:absolute;left:44px;right:44px;top:306px;height:2px;background:#DAD9D1}
.card .r{position:absolute;left:44px;right:44px;font-family:JB;font-weight:700;font-size:28px;line-height:1.3}
.card .r small{display:block;font-family:DM;font-weight:500;font-size:26px;color:#55555F;margin-top:2px}
.card .r i{position:absolute;left:-2px;top:6px;width:20px;height:20px;border-radius:50%;background:#22C55E}
.card .r i.q{border-radius:4px;background:#0C0C10}
.card .r span{display:block;padding-left:40px}
.card .btn{position:absolute;left:44px;right:44px;top:492px;height:84px;border-radius:999px;background:#0C0C10;color:#F4F4EF;display:flex;align-items:center;justify-content:center;font-family:BG;font-weight:800;font-size:44px;letter-spacing:.02em}
</style></head><body>
