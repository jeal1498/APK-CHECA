<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:FS;src:url('../assets/fonts/FiraSans-Bold.ttf');font-weight:800}
@font-face{font-family:FS;src:url('../assets/fonts/FiraSans-Medium.ttf');font-weight:500}
@font-face{font-family:FC;src:url('../assets/fonts/FiraCode.ttf')}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:FS}
.glow{position:absolute;left:-100px;top:560px;width:1280px;height:1000px;background:radial-gradient(circle,rgba(244,63,94,.30),rgba(0,0,0,0) 62%)}
.t{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.04em;line-height:.95;text-transform:uppercase}
.t1{top:250px;font-size:120px;color:#F1F5F2}
.t2{top:380px;font-size:138px;color:#FACC15}
.sp{position:absolute;left:380px;top:700px;width:320px;height:640px;transform:rotate(-4deg)}
.v{position:absolute;width:260px;height:64px;border-radius:32px;background:#F43F5E;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.tag{position:absolute;left:250px;top:1420px;transform:rotate(-3deg);background:#F43F5E;color:#fff;border-radius:28px;padding:26px 40px;font-size:60px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.tag span{font-family:FC;filter:blur(14px);display:inline-block;margin-left:12px}
.q{position:absolute;left:760px;top:560px;font-size:330px;font-weight:800;color:#F43F5E;transform:rotate(12deg);line-height:1}
.sub{position:absolute;left:0;right:0;top:1620px;text-align:center;font-size:52px;font-weight:500;color:#AFB7B2}
.sub b{color:#F1F5F2}
</style></head><body>
<div class="glow"></div>
<div class="t t1">El hábito #4</div>
<div class="t t2">no se negocia</div>
<div class="sp"><div class="v" style="top:0px;left:50px"></div><div class="v" style="top:80px;left:58px"></div><div class="v" style="top:160px;left:62px"></div><div class="v" style="top:240px;left:58px"></div><div class="v" style="top:320px;left:48px"></div><div class="v" style="top:400px;left:34px"></div><div class="v" style="top:480px;left:26px"></div><div class="v" style="top:560px;left:30px"></div></div>
<div class="q">?</div>
<div class="tag">Hábito 4: <span>orilla ya</span></div>
<div class="sub">¿Cuál <b>no</b> te puedes saltar?</div>
</body></html>
