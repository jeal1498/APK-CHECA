<style>
  #captions-root {
    position: absolute;
    inset: 0;

  .caption-layer {
    position: absolute;
    inset: 0;
    z-index: 20;
    pointer-events: none;

  /* the keep-out band, from captionBand(H) — frame content stays above it */
  .caption-stage {
    position: absolute;
    left: 0;
    right: 0;
    top: var(--cap-band-top, 900px);
    height: var(--cap-band-height, 180px);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .caption-group {
    /* every group is absolutely stacked over the SAME band — exactly one shown at a
       time via opacity. Must be absolute: in-flow groups would lay out side-by-side. */
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
  }

  /* Subtítulo v2: sin placa; sombra oscura para leerse sobre cualquier fondo */
  .caption-pill {
    max-width: 86%;

    background: transparent;
    border: 0;
    border-radius: 0;
  }
