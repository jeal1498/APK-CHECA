<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:FS;src:url('../assets/fonts/FiraSans-Bold.ttf');font-weight:800}
@font-face{font-family:FS;src:url('../assets/fonts/FiraSans-Medium.ttf');font-weight:500}
@font-face{font-family:FC;src:url('../assets/fonts/FiraCode.ttf')}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:FS}
.glow{position:absolute;left:-100px;top:620px;width:1280px;height:1000px;background:radial-gradient(circle,rgba(244,63,94,.28),rgba(0,0,0,0) 62%)}
.t{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.04em;line-height:.95;text-transform:uppercase}
.t1{top:250px;font-size:112px;color:#F1F5F2}
.t2{top:370px;font-size:150px;color:#FACC15}
.card{position:absolute;left:190px;top:700px;width:700px;border-radius:40px;background:#F4F5F4;color:#111;padding:50px 56px;transform:rotate(-4deg);box-shadow:0 40px 90px rgba(0,0,0,.8)}
.k{font-family:FC;font-size:30px;letter-spacing:.14em;color:#5C635F}
.f{font-family:FC;font-weight:700;font-size:130px;margin-top:18px;letter-spacing:-.03em}
.r{font-size:42px;font-weight:500;margin-top:24px;color:#222}
.b{margin-top:36px;height:110px;border-radius:22px;background:#111;color:#fff;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:800}
.tag{position:absolute;left:330px;top:1390px;transform:rotate(-3deg);background:#F43F5E;color:#fff;border-radius:28px;padding:26px 40px;font-size:62px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.tag span{font-family:FC;filter:blur(14px);display:inline-block;margin-left:12px}
.q{position:absolute;left:830px;top:540px;font-size:330px;font-weight:800;color:#F43F5E;transform:rotate(12deg);line-height:1}
.sub{position:absolute;left:0;right:0;top:1600px;text-align:center;font-size:52px;font-weight:500;color:#AFB7B2}
.sub b{color:#F1F5F2}
</style></head><body>
<div class="glow"></div>
<div class="t t1">Lo que la app</div>
<div class="t t2">no te dice</div>
<div class="card"><div class="k">NUEVA SOLICITUD</div><div class="f">$85.00</div>
<div class="r">● A 4 min (1.5 km)</div><div class="r">■ Viaje: 18 min (7.5 km)</div><div class="b">Aceptar</div></div>
<div class="q">?</div>
<div class="tag">Te quedan <span>$67</span></div>
<div class="sub">¿Cuánto <b>ganas tú</b> de verdad?</div>
</body></html>
