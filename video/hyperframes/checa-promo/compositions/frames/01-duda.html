  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });
      var DUR = 2.952;
      // One beat array from the voiceover onsets: ¿aceptas · viajes · sin saber · de verdad · conviene

        { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.42, ease: "power4.out" },
        BEATS[0]);

      // Scene 2 — card rises into the middle, tilted −4° (rise + rotate, circ.out)
      tl.fromTo("#duda01-cardwrap",
        { y: 520, rotation: 6, opacity: 0 },
        { y: 0, rotation: -4, opacity: 1, duration: 0.55, ease: "circ.out" },
        BEATS[1]);
      tl.fromTo("#duda01-ghost",
        { x: 0, y: 0, rotation: 0 },
        { x: 34, y: 26, rotation: 5, duration: 0.6, ease: "expo.out" },
        BEATS[1] + 0.08);

      // "viajes" side-snaps in below, then hard-cuts to "sin saber"
      tl.fromTo("#duda01-viajes",
        { x: -260, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.3, ease: "expo.out" },
        BEATS[1]);
      tl.set("#duda01-viajes", { opacity: 0 }, BEATS[2]);
      tl.set("#duda01-saber", { opacity: 0 }, 0);
      tl.set("#duda01-saber", { opacity: 1 }, BEATS[2]);

      // "de verdad" — yellow stroke draws under "sin saber"
      tl.fromTo("#duda01-line",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.4, ease: "power3.out" },
        BEATS[3]);

      // Slow push-in underneath from the card beat to the end
      tl.fromTo("#duda01-stage",
        { scale: 1 },
        { scale: 1.04, duration: DUR - BEATS[1], ease: "none" },
        BEATS[1]);

      // Scene 3 — giant "?" spring-pops over the card corner (the one playful overshoot)

        { scale: 0, opacity: 0, rotation: -14 },
        { scale: 1, opacity: 1, rotation: 8, duration: 0.55, ease: "back.out(1.8)" },
