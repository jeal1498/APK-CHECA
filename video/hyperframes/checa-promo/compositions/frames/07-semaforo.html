    (function () {
      const ID = "07-semaforo";
      const DUR = 5.616;
      const T_V = 2.16, T_A = 2.77, T_R = 4.02;
      const q = (s) => document.getElementById(s);
      const tl = gsap.timeline({ paused: true });

      // Scene 1 — kicker + anchor land (hero visible by 0.5s)
      tl.fromTo("#s07-glow-n", { opacity: 0 }, { opacity: 1, duration: 0.8, ease: "power2.out" }, 0);
      tl.fromTo("#s07-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
      tl.fromTo("#s07-rule", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.15);

      // traffic-light capsule assembles on "semáforo"

      // pop-up anchor: one entrance, then pinned for the rest of the frame
      tl.fromTo("#s07-pop-wrap", { opacity: 0, scale: 0.92, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.3)" }, 0.2);
      tl.fromTo("#s07-legend", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.0);

      // discrete states — hard cuts at the voice cues (reverse search)
      const STATES = [
        { t: 0, lvl: "", accion: "", neta: "$118", linea: "Viaje $150 · Gasolina −$32", f1: ["$321/h", ""], f2: ["$9.4/km", ""], f3: ["28 min", "16 km total"] },
        { t: T_V, lvl: "cp-verde", accion: "ACEPTAR", neta: "$118", linea: "Viaje $150 · Gasolina −$32", f1: ["$321/h", "cp-ok"], f2: ["$9.4/km", "cp-ok"], f3: ["28 min", "16 km total"] },
        { t: T_A, lvl: "cp-amarillo", accion: "CONSIDERAR", neta: "$84", linea: "Viaje $117 · Gasolina −$33", f1: ["$268/h", "cp-ok"], f2: ["$7.1/km", "cp-mal"], f3: ["26 min", "16.5 km total"] },

      function stateAt(time) {
        for (let i = STATES.length - 1; i >= 0; i--) if (time >= STATES[i].t) return STATES[i];
        return STATES[0];
      }
      let last = null;
      function render(time) {
        const s = stateAt(time);
        if (s === last) return;
        last = s;
        q("s07-cp").className = "cp" + (s.lvl ? " " + s.lvl : "");
        q("s07-accion").textContent = s.accion;
        q("s07-neta").textContent = s.neta;
        q("s07-linea").textContent = s.linea;
        q("s07-f1b").textContent = s.f1[0]; q("s07-f1").className = "cp-ficha" + (s.f1[1] ? " " + s.f1[1] : "");

        q("s07-f3b").textContent = s.f3[0]; q("s07-f3s").textContent = s.f3[1];
        ["s07-it-v", "s07-it-a", "s07-it-r"].forEach((id) => {
          const el = q(id);
          const on = LEGEND[s.lvl] && LEGEND[s.lvl][0] === id;
          el.style.color = on ? LEGEND[s.lvl][1] : "#4A524E";
          el.firstChild.style.background = on ? LEGEND[s.lvl][1] : "#2E3532";
        });
      }
      const driver = { t: 0 };
      tl.to(driver, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(driver.t) }, 0);
      render(0);

      // per-cut: light ignites (others dim), band flash, glow swap
      const CUTS = [
        { t: T_V, luz: "#s07-luz-v", glow: "#s07-glow-v", prevLuz: null, prevGlow: "#s07-glow-n" },

      CUTS.forEach((c) => {
        tl.fromTo(c.luz + " .s07-dot-on", { opacity: 0 }, { opacity: 1, duration: 0.06, ease: "none" }, c.t);
        tl.fromTo(c.luz + " .s07-halo", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power2.out" }, c.t);
        tl.fromTo(c.luz + " .s07-dot-on", { scale: 1.12 }, { scale: 1, duration: 0.3, ease: "power2.out" }, c.t);
        if (c.prevLuz) {
          tl.to(c.prevLuz + " .s07-dot-on", { opacity: 0, duration: 0.12, ease: "power1.out" }, c.t);
          tl.to(c.prevLuz + " .s07-halo", { opacity: 0, duration: 0.12, ease: "power1.out" }, c.t);
        }
        tl.fromTo("#s07-flash", { opacity: 0.45 }, { opacity: 0, duration: 0.22, ease: "power2.out", immediateRender: false }, c.t);
        tl.to(c.prevGlow, { opacity: 0, duration: 0.25, ease: "power1.out" }, c.t);
        tl.fromTo(c.glow, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power1.out", immediateRender: false }, c.t);
      });

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
