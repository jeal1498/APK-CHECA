    (function () {

      var $ = function (id) { return document.getElementById(id); };

      var tl = gsap.timeline({ paused: true });

      // Scene 1 (0.0–0.6): couple establishes

      tl.fromTo(note, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out" }, 0.3);
      tl.fromTo(c2, { opacity: 0, y: 40 }, { opacity: 0, y: 40, duration: 0.01 }, 0);

      // Scene 2 (0.61–1.5): "+" presses twice (press-release-spring), value $8 -> $9 -> $10
      tl.to(plus, { scale: 0.9, boxShadow: "0 4px 10px rgba(34,197,94,0.25)", duration: 0.1, ease: "power1.in" }, 0.61);
      tl.to(plus, { scale: 1, boxShadow: "0 12px 30px rgba(34,197,94,0.35)", duration: 0.22, ease: "back.out(1.4)" }, 0.71);
      tl.to(plus, { scale: 0.9, boxShadow: "0 4px 10px rgba(34,197,94,0.25)", duration: 0.1, ease: "power1.in" }, 0.93);
      tl.to(plus, { scale: 1, boxShadow: "0 12px 30px rgba(34,197,94,0.35)", duration: 0.45, ease: "back.out(1.4)" }, 1.03);
      tl.fromTo(burst, { scale: 1, opacity: 0 }, { scale: 2.6, opacity: 0.6, duration: 0.2, ease: "power2.out" }, 0.71);
      tl.to(burst, { opacity: 0, duration: 0.12, ease: "power2.in" }, 0.91);

      tl.fromTo(popwrap, { scale: 1.03 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, 1.03);

      // Discrete states (discrete-text-sequence): reverse search, instant jumps
      var SEQ = [
        { t: 0.0,  v: "$8",  lvl: 0 },
        { t: 0.71, v: "$9",  lvl: 0 },
