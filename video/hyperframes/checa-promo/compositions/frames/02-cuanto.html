  <script>
    (function () {
      window.__timelines = window.__timelines || {};
      var FRAME = "02-cuanto";
      var DUR = 4.676;
      var root = document.querySelector('[data-composition-id="02-cuanto"]');
      var q = function (id) { return root.querySelector('[id="' + id + '"]'); };

      var kicker = q("frame-02-cuanto-kicker");
      var camera = q("frame-02-cuanto-camera");
      var counter = q("frame-02-cuanto-counter");
      var label = q("frame-02-cuanto-label");
      var w1 = q("frame-02-cuanto-w1");
      var w2 = q("frame-02-cuanto-w2");
      var w3 = q("frame-02-cuanto-w3");
      var stamp = q("frame-02-cuanto-stamp");
      var note = q("frame-02-cuanto-note");

      var tl = gsap.timeline({ paused: true });

      // ---- Scene 1 (0.0–1.3): light ground, kicker + big "$0" ----
      tl.fromTo(kicker, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);

      var START_SCALE = 0.55; // START_SIZE / END_SIZE
      tl.fromTo(counter, { opacity: 0, scale: START_SCALE * 0.85 },
        { opacity: 1, scale: START_SCALE, duration: 0.4, ease: "power3.out" }, 0);

      // ---- Scene 2 (1.3–2.5): value-scaled count-up $0 -> $150 ----
      var COUNT_AT = 1.3, COUNT_DUR = 1.15, COUNT_EASE = "power3.out";
      var state = { value: 0 };
      tl.to(state, {
        value: 150,
        duration: COUNT_DUR,
        ease: COUNT_EASE,
        onUpdate: function () { counter.textContent = "$" + Math.round(state.value); }
      }, COUNT_AT);
      tl.fromTo(counter, { scale: START_SCALE }, { scale: 1, duration: COUNT_DUR, ease: COUNT_EASE, immediateRender: false }, COUNT_AT);
      tl.fromTo(label, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.5);

      // ---- Camera: slow drift + push THROUGH the "0" (Scene 3, 2.5–3.0) ----
      var phase = { scale: 1, blur: 0 };
      tl.to(phase, { scale: 1.04, duration: 2.4, ease: "power2.out" }, 0.1);
      tl.to(phase, { scale: 18, duration: 0.5, ease: "power3.in" }, 2.5);
      // motion-blur streak peaks at max push velocity
      tl.to(phase, { blur: 14, duration: 0.42, ease: "power2.in" }, 2.55);
      tl.to(camera, { opacity: 0, duration: 0.14, ease: "power1.in" }, 2.86);

      var drift = { p: 0 };
      tl.to(drift, {
        p: Math.PI * 2 * 1.2,
        duration: DUR,
        ease: "none",
        onUpdate: function () {
          var dx = Math.sin(drift.p) * 4;
          var dy = Math.sin(drift.p * 1.3) * 2;
          camera.style.transform = "translate(" + dx + "px, " + dy + "px) scale(" + phase.scale + ")";
          camera.style.filter = phase.blur > 0.05 ? "blur(" + phase.blur.toFixed(2) + "px)" : "none";
        }
      }, 0);

      // land on the stacked line, one word at a time (arrive from depth, blur resolves)
      var words = [w1, w2, w3];
      var WORD_AT = [2.92, 3.18, 3.42];
      words.forEach(function (w, i) {

          { opacity: 0, scale: 1.6, filter: "blur(12px)" },
          { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.32, ease: "power3.out" },

        { opacity: 0, scale: 2.2, rotation: -6 },
