<!--
  Pop-up REAL de Checa (Popup.kt, paleta TemaPopup). Copiar tal cual; cambiar solo cifras, nivel y clases.
  Tamaño: ancho base 860px; para otro ancho usa style="--u:0.9" (escala todo).
  Niveles: cp-verde (ACEPTAR) · cp-amarillo (CONSIDERAR) · cp-rojo (RECHAZAR, texto blanco en la franja).
  Variantes: cp-oro (borde dorado grueso + estrella = la mejor de 2 ofertas) · cp-apagada (franja al 50 %).
  Ficha: cp-ok (número verde, cumple la meta) · cp-mal (fondo #381818, borde y número rojos, no cumple) · sin clase (blanco).
  Regla: ningún texto puede ser solo un monto suelto; siempre «$x netos», «$x/h», «$x/km», «… km total».
-->
<style>
  .cp { --u: 1; width: calc(860px * var(--u)); border-radius: calc(40px * var(--u)); background: #181C1A; border: calc(3px * var(--u)) solid #2E3532; overflow: hidden; box-shadow: 0 calc(24px * var(--u)) calc(60px * var(--u)) rgba(0,0,0,.6); font-family: "Fira Sans", sans-serif; color: #F2F5F3; }
  .cp.cp-oro { border: calc(10px * var(--u)) solid #E8B84A; }
  .cp-banda { height: calc(100px * var(--u)); display: flex; align-items: center; justify-content: space-between; padding: 0 calc(34px * var(--u)); color: #08130C; }
  .cp-verde .cp-banda { background: #22C55E; } .cp-amarillo .cp-banda { background: #F5B70A; } .cp-rojo .cp-banda { background: #EF4444; color: #fff; }
  .cp-apagada .cp-banda { opacity: .5; }
  .cp-lado { width: calc(190px * var(--u)); display: flex; align-items: center; gap: calc(8px * var(--u)); }
  .cp-lado.der { justify-content: flex-end; }
  .cp-app { background: #222826; color: #fff; border-radius: 999px; padding: calc(6px * var(--u)) calc(16px * var(--u)); font-size: calc(26px * var(--u)); font-weight: 700; }
  .cp-accion { font-size: calc(50px * var(--u)); font-weight: 700; letter-spacing: calc(5px * var(--u)); }
  .cp-cuerpo { padding: calc(34px * var(--u)) calc(30px * var(--u)) calc(30px * var(--u)); text-align: center; }
  .cp-neta { font-family: "Fira Code", monospace; font-weight: 700; font-size: calc(124px * var(--u)); line-height: 1; }
  .cp-neta small { font-size: .4em; color: #B4BCB7; }
  .cp-linea { font-size: calc(38px * var(--u)); color: #B4BCB7; margin-top: calc(22px * var(--u)); }
  .cp-fichas { display: flex; gap: calc(20px * var(--u)); margin-top: calc(40px * var(--u)); }
  .cp-ficha { flex: 1; height: calc(156px * var(--u)); border-radius: calc(28px * var(--u)); background: #181C1A; border: calc(3px * var(--u)) solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .cp-ficha b { font-family: "Fira Code", monospace; font-weight: 700; font-size: calc(48px * var(--u)); white-space: nowrap; }
  .cp-ficha span { font-size: calc(28px * var(--u)); color: #7D8781; margin-top: calc(4px * var(--u)); }
  .cp-ok b { color: #22C55E; } .cp-mal { background: #381818; border-color: #EF4444; } .cp-mal b { color: #EF4444; }
</style>
<!-- Ejemplo: oferta que conviene (números de ejemplo: $150 de tarifa, gasolina $32, 16 km, 28 min) -->
<div class="cp cp-verde">
  <div class="cp-banda">
    <div class="cp-lado"><span class="cp-app">UBER</span></div>
    <div class="cp-accion">ACEPTAR</div>
    <div class="cp-lado der"><svg width="44" height="44" viewBox="0 0 24 24"><path d="M6 6 L18 18 M18 6 L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></div>
  </div>
  <div class="cp-cuerpo">
    <div class="cp-neta">$118<small>&nbsp;netos</small></div>
    <div class="cp-linea">Viaje $150&nbsp;·&nbsp;Gasolina −$32</div>
    <div class="cp-fichas">
      <div class="cp-ficha cp-ok"><b>$321/h</b><span>por hora</span></div>
      <div class="cp-ficha cp-ok"><b>$9.4/km</b><span>por km</span></div>
      <div class="cp-ficha"><b>28 min</b><span>16 km total</span></div>
    </div>
  </div>
</div>
