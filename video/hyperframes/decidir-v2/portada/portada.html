<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:BG;src:url('../assets/fonts/bricolage-grotesque-latin-800-normal.woff2');font-weight:800}
@font-face{font-family:DM;src:url('../assets/fonts/dm-sans-latin-500-normal.woff2');font-weight:500}
@font-face{font-family:DM;src:url('../assets/fonts/dm-sans-latin-700-normal.woff2');font-weight:700}
@font-face{font-family:JB;src:url('../assets/fonts/jetbrains-mono-latin-700-normal.woff2');font-weight:700}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#0C0C10;font-family:DM}
.glow{position:absolute;left:-100px;top:620px;width:1280px;height:1000px;background:radial-gradient(circle,rgba(239,68,68,.26),rgba(0,0,0,0) 62%)}
.t{position:absolute;left:0;right:0;text-align:center;font-family:BG;font-weight:800;letter-spacing:-.04em;line-height:.95;text-transform:uppercase}
.t1{top:320px;font-size:104px;color:#F4F4EF}
.t2{top:440px;font-size:132px;color:#FACC15}
.card{position:absolute;left:230px;top:700px;width:620px;height:590px;border-radius:44px;background:#F4F4EF;transform:rotate(-4deg);box-shadow:0 40px 90px rgba(0,0,0,.8)}
.card .k{position:absolute;left:52px;top:44px;font-family:JB;font-size:28px;letter-spacing:.14em;color:#5C635F;text-transform:uppercase}
.card .fare{position:absolute;left:52px;top:100px;font-family:BG;font-weight:800;font-size:150px;letter-spacing:-.04em;color:#0C0C10;line-height:1}
.card svg{position:absolute;left:445px;top:110px;width:110px;height:110px}
.card .d{position:absolute;left:52px;font-family:JB;font-size:34px;color:#3A403D}
.card .d1{top:290px}.card .d2{top:344px}
.card .btn{position:absolute;left:52px;right:52px;top:420px;height:110px;border-radius:26px;background:#22C55E;color:#04120A;display:flex;align-items:center;justify-content:center;font-family:BG;font-weight:800;font-size:60px;letter-spacing:.06em}
.tag{position:absolute;left:240px;top:1340px;transform:rotate(-3deg);background:#EF4444;color:#fff;border-radius:28px;padding:26px 40px;font-family:BG;font-size:60px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.tag span{font-family:JB;filter:blur(14px);display:inline-block;margin-left:12px}
.q{position:absolute;left:790px;top:610px;font-family:BG;font-size:320px;font-weight:800;color:#EF4444;transform:rotate(12deg);line-height:1}
.sub{position:absolute;left:0;right:0;top:1500px;text-align:center;font-size:52px;font-weight:500;color:#AFB7B2}
.sub b{color:#F4F4EF;font-weight:700}
</style></head><body>
<div class="glow"></div>
<div class="t t1">Te dan segundos</div>
<div class="t t2">¿y la cuenta?</div>
<div class="card"><div class="k">Nueva oferta</div><div class="fare">$120</div>
<svg viewBox="0 0 100 100" fill="none"><circle cx="50" cy="50" r="40" stroke="#D5D9D7" stroke-width="12"/><path d="M50 10 A40 40 0 1 1 14 67" stroke="#EF4444" stroke-width="12" stroke-linecap="round"/></svg>
<div class="d d1">5 min (1.8 km)</div><div class="d d2">18 min (9 km)</div><div class="btn">ACEPTAR</div></div>
<div class="q">?</div>
<div class="tag">Te quedan <span>$▒▒</span></div>
<div class="sub">¿Aceptas <b>a ciegas</b>?</div>
</body></html>
