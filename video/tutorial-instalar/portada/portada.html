<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:FS;src:url('../../hyperframes/checa-promo/assets/fonts/FiraSans-Bold.ttf');font-weight:800}
@font-face{font-family:FS;src:url('../../hyperframes/checa-promo/assets/fonts/FiraSans-Medium.ttf');font-weight:500}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:FS}
.glow{position:absolute;left:-100px;top:620px;width:1280px;height:1000px;background:radial-gradient(circle,rgba(244,63,94,.28),rgba(0,0,0,0) 62%)}
.t{position:absolute;left:0;right:0;text-align:center;font-weight:800;letter-spacing:-.04em;line-height:.95;text-transform:uppercase}
.t1{top:230px;font-size:100px;color:#F1F5F2}
.t2{top:340px;font-size:118px;color:#FACC15}
.card{position:absolute;left:180px;top:620px;width:720px;border-radius:36px;overflow:hidden;transform:rotate(-4deg);box-shadow:0 40px 90px rgba(0,0,0,.8);background:#fff}
.card img{display:block;width:100%}
.tag{position:absolute;left:250px;top:1330px;transform:rotate(-3deg);background:#F43F5E;color:#fff;border-radius:28px;padding:26px 40px;font-size:62px;font-weight:800;box-shadow:0 20px 50px rgba(0,0,0,.7)}
.tag span{filter:blur(14px);display:inline-block;margin-left:12px}
.q{position:absolute;left:840px;top:500px;font-size:330px;font-weight:800;color:#F43F5E;transform:rotate(12deg);line-height:1}
.sub{position:absolute;left:0;right:0;top:1560px;text-align:center;font-size:52px;font-weight:500;color:#AFB7B2}
.sub b{color:#F1F5F2}
</style></head><body>
<div class="glow"></div>
<div class="t t1">¿Android no te</div>
<div class="t t2">deja instalarla?</div>
<div class="card"><img src="captura.png"></div>
<div class="q">?</div>
<div class="tag">La solución: <span>apaga esto</span></div>
<div class="sub">Instala <b>Checa</b> paso a paso</div>
</body></html>
