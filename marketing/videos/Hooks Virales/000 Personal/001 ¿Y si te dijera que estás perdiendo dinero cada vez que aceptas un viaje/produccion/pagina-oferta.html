<script src="palabras.js"></script><script>
const G='#22C55E',R='#EF4444',Y='#FACC15',K='#0C0C10';
const P=D.palabras,TOTAL=D.total,norm=w=>w.toLowerCase().replace(/[¿?¡!.,:;]/g,'');

const cl=x=>Math.max(0,Math.min(1,x)),eo=x=>1-Math.pow(1-cl(x),3),mix=(a,b,p)=>a+(b-a)*p,A=(t,a,d)=>eo((t-a)/d);
const st=document.getElementById('st'),IT=[];
function add(html,ini,fin,fx){const d=document.createElement('div');d.innerHTML=html;st.appendChild(d);IT.push({d,ini,fin,fx});return d}
function ofertaU(x,y,w,precio,a,v,ad1,ad2){const s=w/760;const px=n=>(n*s).toFixed(1)+'px';
 const star='<svg viewBox="0 0 24 24" width="'+px(34)+'" height="'+px(34)+'" fill="#0C0C10" style="vertical-align:-.12em"><path d="M12 1.5l3.2 7.2 7.8.8-5.9 5.2 1.7 7.7L12 18.4 5.2 22.4l1.7-7.7L1 9.5l7.8-.8z"/></svg>';
 return '<div style="position:absolute;left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+px(640)+';border-radius:'+px(40)+';background:#fff;border:2px solid #E8E4D2;box-shadow:0 22px 56px rgba(80,70,20,.16);overflow:hidden">'
 +'<div style="position:absolute;left:'+px(34)+';top:'+px(30)+';padding:'+px(8)+' '+px(24)+';border-radius:'+px(10)+';background:#0C0C10;color:#fff;font:700 '+px(32)+'/1.2 \'DM Sans\'">Viaje</div>'
 +'<svg viewBox="0 0 16 16" width="'+px(40)+'" height="'+px(40)+'" style="position:absolute;right:'+px(34)+';top:'+px(30)+'" fill="none" stroke="#0C0C10" stroke-width="2.1" stroke-linecap="square"><path d="M2 2l12 12M14 2L2 14"/></svg>'
 +'<div style="position:absolute;left:'+px(34)+';top:'+px(96)+';font:800 '+px(126)+'/1 \'Bricolage Grotesque\';letter-spacing:'+px(-4)+';color:#0C0C10">'+precio+'</div>'
 +'<div style="position:absolute;left:'+px(38)+';top:'+px(236)+';font:500 '+px(34)+'/1 \'DM Sans\';color:#0C0C10">'+star+'&nbsp; 4.92</div>'
 +'<div style="position:absolute;left:'+px(60)+';top:'+px(330)+';width:'+px(4)+';height:'+px(110)+';background:#0C0C10"></div>'
 +'<div style="position:absolute;left:'+px(50)+';top:'+px(318)+';width:'+px(24)+';height:'+px(24)+';border-radius:50%;background:#0C0C10"></div>'
 +'<div style="position:absolute;left:'+px(50)+';top:'+px(436)+';width:'+px(24)+';height:'+px(24)+';border-radius:'+px(4)+';background:#0C0C10"></div>'
 +'<div style="position:absolute;left:'+px(104)+';top:'+px(300)+'"><div style="font:700 '+px(38)+'/1.1 \'DM Sans\';color:#0C0C10">'+a+'</div><div style="font:400 '+px(30)+'/1.2 \'DM Sans\';color:#6A665A;margin-top:'+px(6)+'">'+ad1+'</div></div>'
 +'<div style="position:absolute;left:'+px(104)+';top:'+px(418)+'"><div style="font:700 '+px(38)+'/1.1 \'DM Sans\';color:#0C0C10">'+v+'</div><div style="font:400 '+px(30)+'/1.2 \'DM Sans\';color:#6A665A;margin-top:'+px(6)+'">'+ad2+'</div></div>'
 +'<div style="position:absolute;left:'+px(30)+';right:'+px(30)+';bottom:'+px(28)+';height:'+px(96)+';border-radius:'+px(14)+';background:#0C0C10;overflow:hidden"><div style="position:absolute;left:0;top:0;bottom:0;width:62%;background:#2B2B33"></div><div style="position:relative;text-align:center;color:#fff;font:700 '+px(36)+'/'+px(96)+' \'DM Sans\'">Viaje disponible</div></div></div>';}
function popApp(o){const T0='#A3A3AD',N={hdr:'···',hc:T0,bc:'#3A3A45',amt:'',m1:['···',T0,''],m2:['···',T0,''],tot:''};o=Object.assign(N,o);
 const met=m=>'<div style="flex:1;text-align:center;font:500 58px/1 \'JetBrains Mono\';color:'+m[1]+';white-space:nowrap">'+(m[2]?m[2]+' ':'')+m[0]+'</div>';
 return '<div style="position:absolute;left:100px;top:90px;width:780px;border-radius:58px;background:#16161C;border:10px solid '+o.bc+';box-shadow:0 30px 70px rgba(0,0,0,.28)">'
 +'<div style="text-align:center;padding-top:30px;font:800 62px/1.15 \'Bricolage Grotesque\';letter-spacing:6px;color:'+o.hc+'">'+o.hdr+'</div>'
 +'<svg width="40" height="40" viewBox="0 0 24 24" style="position:absolute;right:26px;top:26px" fill="none" stroke="'+T0+'" stroke-width="3" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>'
 +'<div style="text-align:center;padding:6px 0;font:800 168px/1.1 \'Bricolage Grotesque\';letter-spacing:-3px;color:#F4F4EF">'+o.amt+'</div>'
 +'<div style="display:flex;align-items:center;padding:18px 20px 0">'+met(o.m1)+'<div style="width:4px;height:56px;background:rgba(163,163,173,.43);margin:0 12px"></div>'+met(o.m2)+'</div>'
 +'<div style="text-align:center;padding:22px 0 34px;font:500 43px/1.2 \'JetBrains Mono\';color:'+T0+'">'+o.tot+'</div></div>';}
const mono=(s,x,y,c='#8A8678',sz=28)=>'<div style="position:absolute;left:'+x+'px;top:'+y+'px;width:1080px;text-align:center;font:700 '+sz+'px/1 \'JetBrains Mono\';letter-spacing:3px;color:'+c+'">'+s+'</div>';
const cap=(s,c=K)=>'<div style="position:absolute;left:0;top:190px;width:1080px;text-align:center;font:800 92px/.95 \'Bricolage Grotesque\';letter-spacing:-3px;color:'+c+'">'+s+'</div>';
const s2=W('cuando')-.12,s3=W('ten')-.12,s4=W('un')-.12,s5=W('qué')-.12,END=1e9;
// datos de la oferta de ejemplo: $120 · 6 min (2 km) + 40 min (24 km) → 46 min, 26 km, gasolina $52, neta $68
// ── oferta: aparece completa desde el segundo 0 y se mueve de un bloque al siguiente
add(ofertaU(190,0,700,'$120.00','A 6 min (2 km)','Viaje: 40 min (24 km)','Calle Hidalgo 120','Av. Principal 450'),0,s4,(t,d)=>{
 const m=A(t,s3,.5);d.style.transformOrigin='540px 0';d.style.transform='translate(0,'+mix(400,250,m)+'px) scale('+mix(1,.62,m)+')';
 d.style.opacity=Math.min(1,cl((s4+.2-t)/.2))});
add(cap('DINERO QUE<br>NO VES'),0,s2,(t,d)=>{d.style.opacity=cl((s2-t)/.15)});
add(cap('NO SOLO<br>EL <span style="color:#B98206">PRECIO</span>'),s2,s3,(t,d)=>{d.style.opacity=Math.min(cl((t-s2)/.15),cl((s3-t)/.15))});
add(cap('LO QUE <span style="color:'+R+'">GASTAS</span>'),s3,s4,(t,d)=>{d.style.opacity=Math.min(cl((t-s3)/.15),cl((s4-t)/.15))});
add('<div style="position:absolute;left:202px;top:478px;width:380px;height:132px;border:7px dashed '+Y+';border-radius:26px;background:rgba(250,204,21,.28)"></div>',W('cuánto'),s3,(t,d)=>{d.style.opacity=Math.min(cl((t-W('cuánto'))/.15),cl((s3-t)/.15));d.style.transform='scale('+(1+.05*Math.sin(Math.PI*cl((t-W('cuánto'))/.4)))+')'});
add(mono('OFERTA DE EJEMPLO',0,1335),0,s5);
// seg 3: tres fichas con lo que cuesta cada cosa
[['Kilómetros','26 km',I_km(),'kilómetros'],['Tiempo','46 min',I_t(),'tiempo'],['Gasolina','−$52',I_g(),'gasolina']].forEach(([n,v,ic,w],k)=>{const a=W(w);
 add('<div style="position:absolute;left:190px;top:'+(690+k*118)+'px;width:700px;height:98px;border-radius:22px;background:#fff;border:3px solid '+(k==2?R:K)+';box-shadow:0 14px 34px rgba(80,70,20,.14);display:flex;align-items:center;gap:20px;padding:0 28px;font:800 44px \'Bricolage Grotesque\';color:'+K+'">'+ic+'<span style="flex:1">'+n+'</span><span style="color:'+(k==2?R:K)+'">'+v+'</span></div>',a-.05,s4,(t,d)=>{const p=A(t,a-.05,.3);d.style.transform='translateY('+(30*(1-p))+'px)';d.style.opacity=Math.min(cl((t-a+.05)/.12),cl((s4-t)/.2))})});
function I_km(){return svgi('<path d="M12 21s-6-6.1-6-10.5a6 6 0 0112 0C18 14.9 12 21 12 21z"/><circle cx="12" cy="10.5" r="2.2"/>')}
function I_t(){return svgi('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>')}
function I_g(){return svgi('<path d="M4 21V5a2 2 0 012-2h6a2 2 0 012 2v16M3 21h12M6 8h6M14 11h2a2 2 0 012 2v4a1.5 1.5 0 003 0V8l-3-3"/>',R)}
function svgi(p,c=K){return '<svg width="54" height="54" viewBox="0 0 24 24" fill="none" stroke="'+c+'" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'}
// seg 4: la cuenta: paga 120, gasolina −52, te queda 68
const fila=(l,v,c,sz)=>'<div style="position:absolute;left:190px;width:700px;display:flex;justify-content:space-between;align-items:baseline;font:800 '+sz+'px/1 \'Bricolage Grotesque\';letter-spacing:-2px;color:'+c+'"><span style="font-size:48px;letter-spacing:0;font-family:\'DM Sans\';font-weight:700;color:#6A665A">'+l+'</span><span>'+v+'</span></div>';
add(cap('PAGA <span style="color:#B98206">$120</span>'),s4,s5,(t,d)=>{d.style.opacity=Math.min(cl((t-s4)/.15),cl((s5-t)/.15))});
const f1=add(fila('Paga','$120',K,150).replace('left:190px','left:190px;top:470px'),W('pago'),s5,(t,d)=>{const p=A(t,W('pago'),.3);d.style.transform='translateY('+(24*(1-p))+'px)';d.style.opacity=Math.min(cl((t-W('pago'))/.12),cl((s5-t)/.2))});
add(fila('Gasolina','−$52',R,150).replace('left:190px','left:190px;top:660px'),W('no#1'),s5,(t,d)=>{const p=A(t,W('no#1'),.3);d.style.transform='translateY('+(24*(1-p))+'px)';d.style.opacity=Math.min(cl((t-W('no#1'))/.12),cl((s5-t)/.2))});
add('<div style="position:absolute;left:190px;top:850px;width:700px;height:8px;border-radius:4px;background:'+K+'"></div>',W('significa'),s5,(t,d)=>{d.style.transformOrigin='0 0';d.style.transform='scaleX('+A(t,W('significa'),.3)+')';d.style.opacity=cl((s5-t)/.2)});
add(fila('Te queda','$68',G,190).replace('left:190px','left:190px;top:900px'),W('quedar'),s5,(t,d)=>{const p=A(t,W('quedar'),.35);d.style.transform='scale('+(.85+.15*p+.06*Math.sin(Math.PI*cl((t-W('quedar'))/.4)))+')';d.style.transformOrigin='50% 50%';d.style.opacity=Math.min(cl((t-W('quedar'))/.12),cl((s5-t)/.2))});
// seg 5: el pop-up de Checa: primero vacío, y con «antes de aceptar» muestra sus datos
add('<div style="position:absolute;left:-20px;top:420px;width:1080px;height:700px">'+popApp({})+'</div>',s5+.05,END,(t,d)=>{
 const a=W('antes'),p=A(t,s5+.05,.35),on=t>=a;
 d.style.opacity=cl((t-s5-.05)/.15);d.style.transform='translateY('+(40*(1-p))+'px) scale('+(1+(on?.04*Math.sin(Math.PI*cl((t-a)/.4)):0))+')';
 if(d._on!==on){d._on=on;d.firstChild.innerHTML=popApp(on?{hdr:'RECHAZAR',hc:R,bc:R,amt:'$68',m1:['$157/h',R,'✕'],m2:['$4.6/km',R,'✕'],tot:'46 min (26 km) total'}:{}).replace('left:100px;top:90px','left:100px;top:0px')}});
add(cap('¿QUÉ DATO<br>MIRAS?'),s5,END,(t,d)=>{d.style.opacity=cl((t-s5)/.15)});
// ── subtítulos (estilo B, palabra que suena de color)
const GR=[];{let c=[];const cierra=()=>{if(c.length)GR.push(c);c=[]};
 P.forEach(p=>{if(c.length&&(c.length>=3||c.map(q=>q[0]).join(' ').length+p[0].length>16))cierra();c.push(p);if(/[.,?]$/.test(p[0]))cierra()});cierra()}
const sub=document.getElementById('sub'),CLAVE={dinero:G,gasolina:R,pago:Y,paga:Y,'kilómetros':Y,tiempo:Y,aceptar:G};
function subt(t){let i=-1;GR.forEach((c,k)=>{if(t>=c[0][1]-.04)i=k});
 if(i<0||(i===GR.length-1&&t>GR[i][GR[i].length-1][2]+.6)){sub.innerHTML='';return}
 let act=null;GR[i].forEach(p=>{if(t>=p[1]-.04)act=p});if(act&&t>=act[2]+.05)act=null;
 sub.innerHTML=GR[i].map(p=>{const on=p===act;return '<b style="color:'+(on?(CLAVE[norm(p[0])]||'#6EE7A0'):'#fff')+'">'+p[0].replace(/[.,]/g,'')+'</b>'}).join('')}
const TIN=[[0,'#FFFFFF'],[s2,'#FFF2B8'],[s3,'#FFD9D6'],[s4,'#CDF5DA'],[s5,'#E3E6EE']];
function ritmo(t){let c='#fff',a=0;for(const[x,col]of TIN)if(t>=x){c=col;a=x}
 document.getElementById('tinte').style.background=c;document.getElementById('tinte').style.opacity=.75;
 document.getElementById('flash').style.opacity=a>0?.7*cl(1-(t-a)/.14):0;
 let ws=-9;for(const q of P)if(q[1]<=t)ws=q[1];const k=cl((t-ws)/.14);
 st.style.transformOrigin='540px 700px';st.style.transform='scale('+(1+.035*(1-k))+') rotate('+(.6*(1-k)*(Math.floor(ws*10)%2?1:-1))+'deg)'}
window.seek=t=>{ritmo(t);for(const{d,ini,fin,fx}of IT){const on=t>=ini&&t<fin;d.style.display=on?'':'none';if(on&&fx)fx(t,d)}subt(t)};
window.TOTAL=TOTAL;seek(+(new URLSearchParams(location.search).get('t')||0));
</script></body></html>
