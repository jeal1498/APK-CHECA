<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs>
  <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
    <rect width="18" height="18" fill="#ef4444" opacity=".16"/>
    <line x1="0" y1="0" x2="0" y2="18" stroke="#ef4444" stroke-width="5" opacity=".45"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#000" flood-opacity=".35"/>
  </filter>
</defs>
<rect width="1080" height="1920" fill="#111827"/>
<!-- Área segura general -->
<rect x="54" y="170" width="821" height="1200" rx="24" fill="#1e293b" stroke="#22c55e" stroke-width="6"/>
<!-- Cámara -->
<rect x="72" y="190" width="785" height="440" rx="18" fill="#24435d"/>
<text x="464" y="395" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="54" font-weight="700">TU CÁMARA</text>
<text x="464" y="455" text-anchor="middle" fill="#cbd5e1" font-family="Arial,sans-serif" font-size="30">35–40% del contenido</text>
<!-- Zona dedicada a subtítulos -->
<rect x="72" y="650" width="785" height="170" rx="18" fill="#334155" stroke="#facc15" stroke-width="4" stroke-dasharray="12 8"/>
<text x="464" y="690" text-anchor="middle" fill="#fde68a" font-family="Arial,sans-serif" font-size="25" font-weight="700">ZONA EXCLUSIVA DE SUBTÍTULOS</text>
<rect x="125" y="710" width="678" height="88" rx="14" fill="#0f172a" opacity=".96" filter="url(#shadow)"/>
<text x="464" y="746" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">Aquí va una frase breve</text>
<text x="464" y="780" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="29" font-weight="700">de máximo dos líneas</text>
<!-- Gráficos -->
<rect x="72" y="840" width="785" height="510" rx="18" fill="#243b31"/>
<text x="464" y="1060" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">GRÁFICOS / ANIMACIÓN</text>
<text x="464" y="1120" text-anchor="middle" fill="#d1fae5" font-family="Arial,sans-serif" font-size="28">Datos, ejemplos y demostraciones</text>
<!-- Zonas de exclusión de interfaz -->
<rect x="0" y="0" width="1080" height="160" fill="url(#hatch)"/>
<rect x="890" y="160" width="190" height="1210" fill="url(#hatch)"/>
<rect x="0" y="1390" width="1080" height="530" fill="url(#hatch)"/>
<g fill="#fecaca" font-family="Arial,sans-serif" font-size="28" font-weight="700">
  <text x="540" y="90" text-anchor="middle">EVITAR ELEMENTOS IMPORTANTES</text>
  <text x="985" y="760" text-anchor="middle" transform="rotate(90 985 760)">BOTONES DE LA PLATAFORMA</text>
  <text x="540" y="1645" text-anchor="middle">DESCRIPCIÓN · AUDIO · CONTROLES</text>
</g>
<text x="540" y="1840" text-anchor="middle" fill="#e5e7eb" font-family="Arial,sans-serif" font-size="25">PLANTILLA GUÍA · 1080 × 1920 · 9:16</text>
</svg>